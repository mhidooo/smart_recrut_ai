spring.application.name=smartrecruit-ai

spring.datasource.url=jdbc:postgresql://localhost:5433/smartrecruit_new
spring.datasource.username=smartuser
spring.datasource.password=smartpass

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8081

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=smartrecruit-ai
app.jwt.expiration-seconds=900